name: meridian-emr

services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    init: true
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    stop_grace_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: meridian-emr-backend:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/healthz", timeout=5)'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    stop_grace_period: 30s

  reasoning-worker:
    image: meridian-emr-backend:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    init: true
    command:
      - celery
      - -A
      - app.celery_app.celery_app
      - worker
      - -Q
      - patient_emr
      - --loglevel=INFO
      - --hostname=patient-emr@%h
      - --concurrency=1
    stop_grace_period: 60s

  transcription-worker:
    image: meridian-emr-backend:${IMAGE_TAG:-latest}
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    init: true
    command:
      - celery
      - -A
      - app.celery_app.celery_app
      - worker
      - -Q
      - voice_transcription
      - --loglevel=INFO
      - --hostname=transcription@%h
      - --concurrency=1
    stop_grace_period: 60s

volumes:
  redis-data:
