name: meridian-emr

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: meridian-emr-backend:${IMAGE_TAG:-latest}
    env_file:
      - .env
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8000/healthz", timeout=5)
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 30s
    stop_grace_period: 30s

  reasoning-worker:
    image: meridian-emr-backend:${IMAGE_TAG:-latest}
    env_file:
      - .env
    restart: unless-stopped
    init: true
    command:
      - celery
      - -A
      - app.celery_app.celery_app
      - worker
      - -Q
      - patient_emr
      - --loglevel=INFO
      - --hostname=patient-emr@%h
      - --concurrency=1
    stop_grace_period: 60s

  transcription-worker:
    image: meridian-emr-backend:${IMAGE_TAG:-latest}
    env_file:
      - .env
    restart: unless-stopped
    init: true
    command:
      - celery
      - -A
      - app.celery_app.celery_app
      - worker
      - -Q
      - voice_transcription
      - --loglevel=INFO
      - --hostname=transcription@%h
      - --concurrency=1
    stop_grace_period: 60s