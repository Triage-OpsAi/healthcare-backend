name: Deploy backend to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: meridian-emr-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy exact commit
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    env:
      SSH_HOST: ${{ secrets.EC2_HOST }}
      SSH_USER: ${{ secrets.EC2_USER }}
      DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH }}
      SSH_KEY_FILE: /tmp/ec2_deploy_key
      RELEASE_ARCHIVE: meridian-emr-${{ github.sha }}.tar.gz
      LOCAL_ENV_FILE: /tmp/meridian-production.env

    steps:
      - name: Check out pushed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate EC2 deployment secrets
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          required_values=(
            "$SSH_HOST"
            "$SSH_USER"
            "$DEPLOY_PATH"
            "$SSH_PRIVATE_KEY"
            "$SSH_KNOWN_HOSTS"
          )

          for value in "${required_values[@]}"; do
            if [[ -z "$value" ]]; then
              echo "::error::One or more required EC2 deployment secrets are missing."
              exit 1
            fi
          done

          if [[ "$DEPLOY_PATH" != /* || "$DEPLOY_PATH" == "/" ]]; then
            echo "::error::EC2_DEPLOY_PATH must be an absolute path other than /."
            exit 1
          fi

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          install -d -m 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$SSH_KEY_FILE"
          chmod 600 "$SSH_KEY_FILE"

          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Test SSH connection
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -i "$SSH_KEY_FILE" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "echo 'SSH connection successful'"

      - name: Create production env from GitHub Environment
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || vars.DATABASE_URL }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || vars.JWT_SECRET_KEY }}
          JWT_ALGORITHM: ${{ vars.JWT_ALGORITHM }}
          ACCESS_TOKEN_EXPIRE_MINUTES: ${{ vars.ACCESS_TOKEN_EXPIRE_MINUTES }}
          REFRESH_TOKEN_EXPIRE_DAYS: ${{ vars.REFRESH_TOKEN_EXPIRE_DAYS }}

          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY || vars.SARVAM_API_KEY }}
          SARVAM_BASE_URL: ${{ vars.SARVAM_BASE_URL }}
          SARVAM_STT_MODEL: ${{ vars.SARVAM_STT_MODEL }}

          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || vars.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_EMBEDDING_MODEL: ${{ vars.OPENAI_EMBEDDING_MODEL }}
          OPENAI_REASONING_EFFORT: ${{ vars.OPENAI_REASONING_EFFORT }}

          REDIS_URL: ${{ secrets.REDIS_URL || vars.REDIS_URL }}

          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || vars.AWS_REGION }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET || vars.AWS_S3_BUCKET }}
          AWS_S3_PRESIGN_EXPIRE_SECONDS: ${{ secrets.AWS_S3_PRESIGN_EXPIRE_SECONDS || vars.AWS_S3_PRESIGN_EXPIRE_SECONDS }}
          VOICE_UPLOAD_MAX_BYTES: ${{ vars.VOICE_UPLOAD_MAX_BYTES }}

          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          DOCTOR_FRONTEND_URL: ${{ vars.DOCTOR_FRONTEND_URL }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS || vars.CORS_ORIGINS }}

          SMTP_HOST: ${{ vars.SMTP_HOST || secrets.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME || vars.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM_EMAIL: ${{ vars.SMTP_FROM_EMAIL || secrets.SMTP_FROM_EMAIL }}
          SMTP_FROM_NAME: ${{ vars.SMTP_FROM_NAME }}
          SMTP_USE_TLS: ${{ vars.SMTP_USE_TLS }}
          SMTP_USE_SSL: ${{ vars.SMTP_USE_SSL }}
          SMTP_TIMEOUT_SECONDS: ${{ vars.SMTP_TIMEOUT_SECONDS }}
          SMTP_RETRY_ATTEMPTS: ${{ vars.SMTP_RETRY_ATTEMPTS }}
          SMTP_RETRY_BASE_SECONDS: ${{ vars.SMTP_RETRY_BASE_SECONDS }}
          INVITATION_EXPIRE_HOURS: ${{ vars.INVITATION_EXPIRE_HOURS }}

          API_BIND_ADDRESS: ${{ vars.API_BIND_ADDRESS }}
          API_PORT: ${{ vars.API_PORT }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlsplit

          required = [
              "DATABASE_URL",
              "JWT_SECRET_KEY",
              "SARVAM_API_KEY",
              "OPENAI_API_KEY",
              "REDIS_URL",
              "AWS_ACCESS_KEY_ID",
              "AWS_SECRET_ACCESS_KEY",
              "AWS_REGION",
              "AWS_S3_BUCKET",
              "SMTP_HOST",
              "SMTP_FROM_EMAIL",
              "FRONTEND_URL",
              "DOCTOR_FRONTEND_URL",
          ]

          missing = [
              name
              for name in required
              if not os.environ.get(name, "").strip()
          ]

          if missing:
              raise SystemExit(
                  "Missing required GitHub production values: "
                  + ", ".join(missing)
              )

          if os.environ.get("SMTP_USERNAME", "").strip() and not os.environ.get("SMTP_PASSWORD", "").strip():
              raise SystemExit("SMTP_PASSWORD is required when SMTP_USERNAME is set.")

          for name in ("FRONTEND_URL", "DOCTOR_FRONTEND_URL"):
              frontend = urlsplit(os.environ[name].strip())
              if (frontend.scheme != "https" or not frontend.hostname
                  or frontend.hostname in {"localhost", "127.0.0.1", "::1"}
                  or frontend.username or frontend.password
                  or frontend.query or frontend.fragment):
                  raise SystemExit(f"{name} must be a public HTTPS application URL without credentials, query, or fragment.")

          database_url = os.environ["DATABASE_URL"].strip()

          if database_url.startswith("postgresql://"):
              database_url = database_url.replace(
                  "postgresql://",
                  "postgresql+asyncpg://",
                  1,
              )

          parsed_database = urlsplit(database_url)

          if parsed_database.hostname in {
              None,
              "",
              "localhost",
              "127.0.0.1",
          }:
              raise SystemExit(
                  "DATABASE_URL points to localhost or has no valid hostname."
              )

          configured_cors = os.environ.get("CORS_ORIGINS", "").strip()

          if configured_cors:
              try:
                  cors_origins = json.loads(configured_cors)
              except json.JSONDecodeError as error:
                  raise SystemExit(
                      f"CORS_ORIGINS must be a valid JSON array: {error}"
                  ) from error
          else:
              cors_origins = []

          if (
              not isinstance(cors_origins, list)
              or not all(
                  isinstance(origin, str) and origin.strip()
                  for origin in cors_origins
              )
          ):
              raise SystemExit(
                  "CORS_ORIGINS must be a JSON array of non-empty strings."
              )

          required_cors_origins = [
              "http://localhost:3000",
              "http://127.0.0.1:3000",
              "http://localhost:5173",
              "http://127.0.0.1:5173",
              "http://localhost:8081",
              "http://127.0.0.1:8081",
              "https://healthcare.triage-ops.com",
          ]

          for origin in required_cors_origins:
              if origin not in cors_origins:
                  cors_origins.append(origin)

          cors_origins_json = json.dumps(
              cors_origins,
              separators=(",", ":"),
          )

          values = {
              "DATABASE_URL": database_url,

              "JWT_SECRET_KEY": os.environ["JWT_SECRET_KEY"],
              "JWT_ALGORITHM": os.environ.get("JWT_ALGORITHM") or "HS256",
              "ACCESS_TOKEN_EXPIRE_MINUTES": (
                  os.environ.get("ACCESS_TOKEN_EXPIRE_MINUTES") or "15"
              ),
              "REFRESH_TOKEN_EXPIRE_DAYS": (
                  os.environ.get("REFRESH_TOKEN_EXPIRE_DAYS") or "7"
              ),

              "SARVAM_API_KEY": os.environ["SARVAM_API_KEY"],
              "SARVAM_BASE_URL": (
                  os.environ.get("SARVAM_BASE_URL")
                  or "https://api.sarvam.ai"
              ),
              "SARVAM_STT_MODEL": (
                  os.environ.get("SARVAM_STT_MODEL")
                  or "saaras:v3"
              ),

              "OPENAI_API_KEY": os.environ["OPENAI_API_KEY"],
              "OPENAI_MODEL": (
                  os.environ.get("OPENAI_MODEL")
                  or "gpt-5.6-sol"
              ),
              "OPENAI_BASE_URL": (
                  os.environ.get("OPENAI_BASE_URL")
                  or "https://api.openai.com/v1"
              ),
              "OPENAI_EMBEDDING_MODEL": (
                  os.environ.get("OPENAI_EMBEDDING_MODEL")
                  or "text-embedding-3-small"
              ),
              "OPENAI_REASONING_EFFORT": (
                  os.environ.get("OPENAI_REASONING_EFFORT")
                  or "medium"
              ),

              "REDIS_URL": os.environ["REDIS_URL"],

              "AWS_ACCESS_KEY_ID": os.environ["AWS_ACCESS_KEY_ID"],
              "AWS_SECRET_ACCESS_KEY": os.environ[
                  "AWS_SECRET_ACCESS_KEY"
              ],
              "AWS_REGION": os.environ["AWS_REGION"],
              "AWS_S3_BUCKET": os.environ["AWS_S3_BUCKET"],
              "AWS_S3_PRESIGN_EXPIRE_SECONDS": (
                  os.environ.get("AWS_S3_PRESIGN_EXPIRE_SECONDS")
                  or "900"
              ),
              "VOICE_UPLOAD_MAX_BYTES": (
                  os.environ.get("VOICE_UPLOAD_MAX_BYTES")
                  or "104857600"
              ),

              "FRONTEND_URL": os.environ.get(
                  "FRONTEND_URL",
                  "",
              ),
              "DOCTOR_FRONTEND_URL": os.environ.get(
                  "DOCTOR_FRONTEND_URL",
                  "",
              ),
              "CORS_ORIGINS": cors_origins_json,

              "API_BIND_ADDRESS": (
                  os.environ.get("API_BIND_ADDRESS")
                  or "0.0.0.0"
              ),
              "API_PORT": (
                  os.environ.get("API_PORT")
                  or "8000"
              ),
          }

          smtp_defaults = {
              "SMTP_HOST": "",
              "SMTP_PORT": "587",
              "SMTP_USERNAME": "",
              "SMTP_PASSWORD": "",
              "SMTP_FROM_EMAIL": "",
              "SMTP_FROM_NAME": "Meridian Health AI",
              "SMTP_USE_TLS": "true",
              "SMTP_USE_SSL": "false",
              "SMTP_TIMEOUT_SECONDS": "20",
              "SMTP_RETRY_ATTEMPTS": "3",
              "SMTP_RETRY_BASE_SECONDS": "1",
              "INVITATION_EXPIRE_HOURS": "48",
          }
          values.update({
              name: os.environ.get(name) or default
              for name, default in smtp_defaults.items()
          })

          for name, value in values.items():
              if "\n" in value or "\r" in value:
                  raise SystemExit(
                      f"{name} contains an unsupported newline."
                  )

          output = Path("/tmp/meridian-production.env")

          output.write_text(
              "".join(
                  f"{name}={value}\n"
                  for name, value in values.items()
              ),
              encoding="utf-8",
          )

          output.chmod(0o600)

          print("Production env file created.")
          print(f"Database host: {parsed_database.hostname}")
          print(f"Database port: {parsed_database.port}")
          print(f"Database name: {parsed_database.path}")
          PY

      - name: Prepare remote deployment directories
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -i "$SSH_KEY_FILE" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            bash -s -- "$DEPLOY_PATH" <<'REMOTE'
          set -euo pipefail

          deploy_root="$1"

          install -d -m 750 \
            "$deploy_root" \
            "$deploy_root/incoming" \
            "$deploy_root/releases" \
            "$deploy_root/shared"

          command -v docker >/dev/null 2>&1 || {
            echo "Docker is not installed on the EC2 server." >&2
            exit 1
          }

          docker compose version >/dev/null 2>&1 || {
            echo "Docker Compose is not available on the EC2 server." >&2
            exit 1
          }
          REMOTE

      - name: Upload production env to EC2
        shell: bash
        run: |
          set -euo pipefail

          scp \
            -i "$SSH_KEY_FILE" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$LOCAL_ENV_FILE" \
            "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/shared/.env.new"

          ssh \
            -i "$SSH_KEY_FILE" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            bash -s -- "$DEPLOY_PATH" <<'REMOTE'
          set -euo pipefail

          deploy_root="$1"

          chmod 600 "$deploy_root/shared/.env.new"
          mv "$deploy_root/shared/.env.new" "$deploy_root/shared/.env"

          echo "Production env installed at:"
          echo "$deploy_root/shared/.env"

          python3 - "$deploy_root/shared/.env" <<'PY'
          import sys
          from urllib.parse import urlsplit

          env_path = sys.argv[1]
          database_url = None

          with open(env_path, encoding="utf-8") as file:
              for line in file:
                  if line.startswith("DATABASE_URL="):
                      database_url = line.strip().split("=", 1)[1]
                      break

          if not database_url:
              raise SystemExit("DATABASE_URL missing from uploaded env.")

          parsed = urlsplit(database_url)

          if parsed.hostname in {
              None,
              "",
              "localhost",
              "127.0.0.1",
          }:
              raise SystemExit(
                  "Uploaded DATABASE_URL incorrectly points to localhost."
              )

          print(f"Uploaded database host: {parsed.hostname}")
          print(f"Uploaded database port: {parsed.port}")
          print(f"Uploaded database name: {parsed.path}")
          PY
          REMOTE

      - name: Package exact source revision
        shell: bash
        run: |
          set -euo pipefail

          git archive \
            --format=tar.gz \
            --output="$RUNNER_TEMP/$RELEASE_ARCHIVE" \
            "$GITHUB_SHA"

      - name: Upload release archive
        shell: bash
        run: |
          set -euo pipefail

          scp \
            -i "$SSH_KEY_FILE" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$RUNNER_TEMP/$RELEASE_ARCHIVE" \
            "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/incoming/$RELEASE_ARCHIVE"

      - name: Build and deploy
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -i "$SSH_KEY_FILE" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            bash -s -- \
              "$DEPLOY_PATH" \
              "$GITHUB_SHA" \
              "$RELEASE_ARCHIVE" <<'REMOTE'
          set -Eeuo pipefail

          deploy_root="$1"
          release_sha="$2"
          archive_name="$3"

          release_dir="$deploy_root/releases/$release_sha"
          archive_path="$deploy_root/incoming/$archive_name"
          previous_release=""

          if [[ ! "$release_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid release SHA: $release_sha" >&2
            exit 1
          fi

          case "$release_dir" in
            "$deploy_root"/releases/*)
              ;;
            *)
              echo "Release directory escaped deployment root." >&2
              exit 1
              ;;
          esac

          if [[ -L "$deploy_root/current" ]]; then
            previous_release="$(readlink -f "$deploy_root/current")"
          fi

          rollback() {
            exit_code=$?
            trap - ERR

            echo "Deployment failed. Attempting rollback." >&2

            if [[ -n "$previous_release" &&
                  -f "$previous_release/compose.production.yaml" ]]; then
              previous_tag="$(basename "$previous_release")"

              (
                cd "$previous_release"
                export IMAGE_TAG="$previous_tag"

                docker compose \
                  -f compose.production.yaml \
                  up \
                  --detach \
                  --no-build \
                  --remove-orphans
              ) || {
                echo "Automatic rollback failed." >&2
              }
            else
              echo "No previous release is available for rollback." >&2
            fi

            exit "$exit_code"
          }

          trap rollback ERR

          if [[ ! -f "$archive_path" ]]; then
            echo "Release archive not found: $archive_path" >&2
            exit 1
          fi

          if [[ ! -f "$deploy_root/shared/.env" ]]; then
            echo "Production env file is missing." >&2
            exit 1
          fi

          rm -rf "$release_dir"
          install -d -m 750 "$release_dir"

          tar -xzf "$archive_path" -C "$release_dir"

          ln -sfn \
            "$deploy_root/shared/.env" \
            "$release_dir/.env"

          cd "$release_dir"
          export IMAGE_TAG="$release_sha"

          if [[ ! -f compose.production.yaml ]]; then
            echo "compose.production.yaml is missing." >&2
            exit 1
          fi

          docker compose \
            -f compose.production.yaml \
            config --quiet

          echo "Building application image..."

          docker compose \
            -f compose.production.yaml \
            build \
            --pull \
            api \
            </dev/null

          echo "Checking DATABASE_URL received by Docker..."

          docker compose \
            -f compose.production.yaml \
            run \
            --rm \
            --no-deps \
            --no-TTY \
            api \
            python -c '
          import os
          from urllib.parse import urlsplit

          value = os.environ["DATABASE_URL"]
          parsed = urlsplit(value)

          print("Database scheme:", parsed.scheme)
          print("Database host:", parsed.hostname)
          print("Database port:", parsed.port)
          print("Database name:", parsed.path)

          if parsed.hostname in {None, "", "localhost", "127.0.0.1"}:
              raise SystemExit(
                  "Docker received an invalid localhost DATABASE_URL."
              )
          ' </dev/null

          docker compose \
            -f compose.production.yaml \
            run \
            --rm \
            --no-deps \
            --no-TTY \
            api \
            python -m scripts.database_setup --create \
            </dev/null

          docker compose \
            -f compose.production.yaml \
            up \
            --detach \
            --no-build \
            --remove-orphans

          api_container_id="$(
            docker compose \
              -f compose.production.yaml \
              ps \
              --quiet \
              api
          )"

          if [[ -z "$api_container_id" ]]; then
            echo "API container was not created." >&2
            exit 1
          fi

          healthy=false

          for attempt in $(seq 1 30); do
            health_status="$(
              docker inspect \
                --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
                "$api_container_id"
            )"

            echo "API health check $attempt/30: $health_status"

            if [[ "$health_status" == "healthy" ]]; then
              healthy=true
              break
            fi

            if [[ "$health_status" == "unhealthy" ||
                  "$health_status" == "exited" ||
                  "$health_status" == "dead" ]]; then
              docker compose \
                -f compose.production.yaml \
                logs \
                --tail=200 \
                api

              echo "API entered terminal state: $health_status" >&2
              exit 1
            fi

            sleep 5
          done

          if [[ "$healthy" != "true" ]]; then
            docker compose \
              -f compose.production.yaml \
              logs \
              --tail=200 \
              api

            echo "API did not become healthy in time." >&2
            exit 1
          fi

          running_services="$(
            docker compose \
              -f compose.production.yaml \
              ps \
              --services \
              --filter status=running |
              sort
          )"

          expected_services="$(
            printf '%s\n' \
              api \
              redis \
              reasoning-worker \
              transcription-worker |
              sort
          )"

          if [[ "$running_services" != "$expected_services" ]]; then
            echo "Expected services:"
            echo "$expected_services"

            echo "Running services:"
            echo "$running_services"

            docker compose -f compose.production.yaml ps
            docker compose -f compose.production.yaml logs --tail=100

            echo "Not all expected services are running." >&2
            exit 1
          fi

          echo "Checking Redis broker connectivity from the API..."

          docker compose \
            -f compose.production.yaml \
            exec \
            --no-TTY \
            api \
            python -c '
          from app.celery_app import celery_app

          with celery_app.connection_for_write() as connection:
              connection.ensure_connection(
                  max_retries=3,
                  interval_start=1,
                  interval_step=1,
                  interval_max=3,
              )

          print("Redis broker connection successful.")
          ' </dev/null

          echo "Checking Celery worker responses..."

          worker_ping_json="$(
            docker compose \
              -f compose.production.yaml \
              exec \
              --no-TTY \
              api \
              celery \
              -A app.celery_app.celery_app \
              inspect \
              ping \
              --json \
              --timeout=10
          )"

          if ! WORKER_PING_JSON="$worker_ping_json" python3 - <<'PY'
          import json
          import os

          responses = json.loads(os.environ["WORKER_PING_JSON"])
          responding = {
              name
              for name, response in responses.items()
              if response == {"ok": "pong"}
          }
          required_prefixes = ("transcription@", "patient-emr@")
          missing = [
              prefix
              for prefix in required_prefixes
              if not any(name.startswith(prefix) for name in responding)
          ]

          print("Responding Celery workers:", ", ".join(sorted(responding)))

          if missing:
              raise SystemExit(
                  "Missing Celery worker responses: " + ", ".join(missing)
              )
          PY
          then
            docker compose \
              -f compose.production.yaml \
              logs \
              --tail=200 \
              reasoning-worker \
              transcription-worker

            echo "One or more Celery workers did not answer ping." >&2
            exit 1
          fi

          ln -sfn "$release_dir" "$deploy_root/current"
          rm -f "$archive_path"

          trap - ERR

          docker compose -f compose.production.yaml ps
          docker image prune -f

          echo "Successfully deployed commit $release_sha"
          REMOTE

      - name: Clean up sensitive local files
        if: always()
        shell: bash
        run: |
          rm -f "$SSH_KEY_FILE"
          rm -f "$LOCAL_ENV_FILE"
