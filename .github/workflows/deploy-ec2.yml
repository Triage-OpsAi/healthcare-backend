name: Deploy backend to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: meridian-emr-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy exact commit
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    env:
      SSH_HOST: ${{ secrets.EC2_HOST }}
      SSH_USER: ${{ secrets.EC2_USER }}
      DEPLOY_PATH: ${{ secrets.EC2_DEPLOY_PATH }}
      SSH_KEY_FILE: ${{ runner.temp }}/ec2_deploy_key
      RELEASE_ARCHIVE: meridian-emr-${{ github.sha }}.tar.gz

    steps:
      - name: Check out pushed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate required deployment secrets
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          required_values=(
            "$SSH_HOST"
            "$SSH_USER"
            "$DEPLOY_PATH"
            "$SSH_PRIVATE_KEY"
            "$SSH_KNOWN_HOSTS"
          )

          for value in "${required_values[@]}"; do
            if [[ -z "$value" ]]; then
              echo "::error::One or more required EC2 deployment secrets are missing."
              exit 1
            fi
          done

          if [[ "$DEPLOY_PATH" != /* || "$DEPLOY_PATH" == "/" ]]; then
            echo "::error::EC2_DEPLOY_PATH must be an absolute path other than /."
            exit 1
          fi

      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$SSH_KEY_FILE"
          chmod 600 "$SSH_KEY_FILE"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Package exact source revision
        shell: bash
        run: |
          set -euo pipefail
          git archive \
            --format=tar.gz \
            --output="$RUNNER_TEMP/$RELEASE_ARCHIVE" \
            "$GITHUB_SHA"

      - name: Prepare remote release directory
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$SSH_KEY_FILE" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$SSH_USER@$SSH_HOST" \
            bash -s -- "$DEPLOY_PATH" <<'REMOTE'
          set -euo pipefail

          deploy_root="$1"
          install -d -m 750 \
            "$deploy_root" \
            "$deploy_root/incoming" \
            "$deploy_root/releases" \
            "$deploy_root/shared"
          test -f "$deploy_root/shared/.env" || {
            echo "Missing production environment file: $deploy_root/shared/.env" >&2
            exit 1
          }
          command -v docker >/dev/null
          docker compose version >/dev/null
          REMOTE

      - name: Upload release archive
        shell: bash
        run: |
          set -euo pipefail
          scp \
            -i "$SSH_KEY_FILE" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$RUNNER_TEMP/$RELEASE_ARCHIVE" \
            "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/incoming/$RELEASE_ARCHIVE"

      - name: Build and deploy
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -i "$SSH_KEY_FILE" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "$SSH_USER@$SSH_HOST" \
            bash -s -- "$DEPLOY_PATH" "$GITHUB_SHA" "$RELEASE_ARCHIVE" <<'REMOTE'
          set -Eeuo pipefail

          deploy_root="$1"
          release_sha="$2"
          archive_name="$3"
          release_dir="$deploy_root/releases/$release_sha"
          archive_path="$deploy_root/incoming/$archive_name"
          previous_release=""

          if [[ ! "$release_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid release SHA." >&2
            exit 1
          fi

          case "$release_dir" in
            "$deploy_root"/releases/*) ;;
            *)
              echo "Release directory escaped the configured deployment root." >&2
              exit 1
              ;;
          esac

          if [[ -L "$deploy_root/current" ]]; then
            previous_release="$(readlink -f "$deploy_root/current")"
          fi

          rollback() {
            exit_code=$?
            trap - ERR

            echo "Deployment failed; attempting application rollback." >&2
            if [[ -n "$previous_release" && -f "$previous_release/compose.production.yaml" ]]; then
              previous_tag="$(basename "$previous_release")"
              (
                cd "$previous_release"
                export IMAGE_TAG="$previous_tag"
                docker compose -f compose.production.yaml up \
                  --detach \
                  --no-build \
                  --remove-orphans
              ) || echo "Automatic rollback failed; manual intervention is required." >&2
            fi

            exit "$exit_code"
          }
          trap rollback ERR

          test -f "$archive_path"
          rm -rf "$release_dir"
          install -d -m 750 "$release_dir"
          tar -xzf "$archive_path" -C "$release_dir"
          ln -s "$deploy_root/shared/.env" "$release_dir/.env"

          cd "$release_dir"
          export IMAGE_TAG="$release_sha"

          docker compose -f compose.production.yaml config --quiet
          docker compose -f compose.production.yaml build --pull api

          # This is idempotent for the current repository. Replace it with
          # `alembic upgrade head` after proper Alembic migrations are added.
          docker compose -f compose.production.yaml run \
            --rm \
            --no-deps \
            api \
            python -m scripts.database_setup --create

          docker compose -f compose.production.yaml up \
            --detach \
            --no-build \
            --remove-orphans

          api_container_id="$(
            docker compose -f compose.production.yaml ps --quiet api
          )"
          test -n "$api_container_id"

          healthy=false
          for attempt in $(seq 1 30); do
            health_status="$(
              docker inspect \
                --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
                "$api_container_id"
            )"

            if [[ "$health_status" == "healthy" ]]; then
              healthy=true
              break
            fi

            if [[ "$health_status" == "unhealthy" || "$health_status" == "exited" || "$health_status" == "dead" ]]; then
              docker compose -f compose.production.yaml logs --tail=200 api
              echo "API entered terminal health state: $health_status" >&2
              exit 1
            fi

            echo "Waiting for API health ($attempt/30): $health_status"
            sleep 5
          done

          if [[ "$healthy" != "true" ]]; then
            docker compose -f compose.production.yaml logs --tail=200 api
            echo "API did not become healthy before the deployment timeout." >&2
            exit 1
          fi

          running_services="$(
            docker compose -f compose.production.yaml ps \
              --services \
              --filter status=running |
              sort
          )"
          expected_services="$(
            printf '%s\n' api reasoning-worker transcription-worker |
              sort
          )"

          if [[ "$running_services" != "$expected_services" ]]; then
            docker compose -f compose.production.yaml ps
            docker compose -f compose.production.yaml logs --tail=100
            echo "Not all expected services are running." >&2
            exit 1
          fi

          ln -sfn "$release_dir" "$deploy_root/current"
          rm -f "$archive_path"
          trap - ERR

          docker compose -f compose.production.yaml ps
          echo "Successfully deployed commit $release_sha"
          REMOTE
